# Sector/industry/business-summary exclusion keywords for the halal screen.
#
# This is a flat list of keywords. `screen()` matches each one as a
# case-insensitive substring against CompanyProfile.sector, .industry, and
# .business_summary; a single match makes the company non_compliant
# immediately, before any financial ratio is computed.
#
# This list is a reasonable starting point reflecting common AAOIFI-style
# sector screens (conventional banking/insurance/lending, alcohol, tobacco,
# gambling, adult entertainment, pork products, conventional weapons). It is
# editable and NOT exhaustive — add, remove, or narrow entries to match your
# own Shariah board's guidance. Keep entries lowercase; matching is
# case-insensitive regardless, but lowercase keeps the file self-documenting.
#
# Keywords are matched as case-insensitive SUBSTRINGS, so bare single words
# are deliberately avoided where they would collide with unrelated words
# (e.g. a bare "bank" matches "bankruptcy", a bare "lending" matches
# "blending"). Prefer qualified, multi-word phrases — they still catch real
# exclusion-worthy text (a company's sector/industry string like "Banks—
# Diversified" or a business summary mentioning "conventional banking") but
# don't fire on a company that merely emerged from bankruptcy or blends tea.
#
# ---------------------------------------------------------------------------
# What this list does NOT cover: the non-permissible-income ratio
# ---------------------------------------------------------------------------
# These keywords, plus the three market-cap ratios in `halal_thresholds`
# (config/config.yaml), are the whole of the automated screen. The fourth
# AAOIFI-style ratio — non-permissible (e.g. interest) income over total
# revenue, capped at `non_permissible_income_ratio` — is configured but, with
# the bundled yfinance market-data provider, is never actually computed: no
# free data source publishes that figure, because it is a Shariah-specific
# aggregation that general financial-data vendors do not produce.
#
# That gap is permanent and structural, not a per-ticker coverage hole, so
# `screen()` does not let it force every company to "insufficient_data"
# forever (which would make the screen look functional while screening
# nothing). Instead every verdict carries an explicit caveat saying the ratio
# was not checked — see the module docstring in
# stock_advisor/analysis/halal_screen.py for the full reasoning.
#
# Practical consequence: a "compliant" verdict from this tool means "passed
# the sector keywords above and the three computable ratios", not "AAOIFI
# compliant". A company with large interest income (and no excluded-sector
# keyword in its profile text) can still come back compliant here. If that
# ratio matters to you, check it yourself against the company's filings, or
# add keywords above for business models you want excluded outright.

- conventional bank
- commercial bank
- investment bank
- conventional banking
- banks
- insurance
- interest-based lending
- alcohol
- brewery
- brewer
- distillery
- distiller
- winery
- tobacco
- cigarette
- gambling
- casino
- betting
- lottery
- adult entertainment
- pornography
- pork
- swine
- bacon
- arms manufacturing
- conventional weapons manufacturing
- defense contractor
- firearms
- ammunition
