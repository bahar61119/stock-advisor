# Sector/industry/business-summary exclusion keywords for the halal screen.
#
# This is a flat list of keywords. `screen()` matches each one as a
# case-insensitive substring against CompanyProfile.sector, .industry, and
# .business_summary; a single match makes the company non_compliant
# immediately, before any financial ratio is computed.
#
# This list is a reasonable starting point reflecting common AAOIFI-style
# sector screens (conventional banking/insurance/lending, alcohol, tobacco,
# gambling, adult entertainment, pork products, conventional weapons). It is
# editable and NOT exhaustive — add, remove, or narrow entries to match your
# own Shariah board's guidance. Keep entries lowercase; matching is
# case-insensitive regardless, but lowercase keeps the file self-documenting.
#
# Keywords are matched as case-insensitive SUBSTRINGS, so bare single words
# are deliberately avoided where they would collide with unrelated words
# (e.g. a bare "bank" matches "bankruptcy", a bare "lending" matches
# "blending"). Prefer qualified, multi-word phrases — they still catch real
# exclusion-worthy text (a company's sector/industry string like "Banks—
# Diversified" or a business summary mentioning "conventional banking") but
# don't fire on a company that merely emerged from bankruptcy or blends tea.

- conventional bank
- commercial bank
- investment bank
- conventional banking
- banks
- insurance
- interest-based lending
- alcohol
- brewery
- brewer
- distillery
- distiller
- winery
- tobacco
- cigarette
- gambling
- casino
- betting
- lottery
- adult entertainment
- pornography
- pork
- swine
- bacon
- arms manufacturing
- conventional weapons manufacturing
- defense contractor
- firearms
- ammunition
